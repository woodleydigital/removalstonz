  <path d="M62 24c16-6 30 0 36 14" fill="none" stroke="#7FD6C2" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M88 38l10 2 2-10" fill="none" stroke="#7FD6C2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

