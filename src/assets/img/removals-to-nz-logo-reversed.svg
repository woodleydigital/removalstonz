  <path d="M52 14 84 33 52 52 20 33Z" fill="#7FD6C2"/>
  <path d="M20 33 52 52v38L20 71Z" fill="#2A3033"/>
  <path d="M52 52 84 33v38L52 90Z" fill="#12A58A"/>
  <path d="M20 46 52 65v6L20 52Z" fill="#FFFFFF" opacity=".18"/>
